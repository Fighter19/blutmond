name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libmgba-dev \
            libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxfixes-dev \
            libxtst-dev libxinerama-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libibus-1.0-dev

      - name: GBA build
        run: |
          cmake -S . -B build-gba -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-gba.cmake -DCMAKE_BUILD_TYPE=MinSizeRel
          cmake --build build-gba
          arm-none-eabi-size build-gba/*.elf

      - name: Host build and tests (including the GBA images in mGBA)
        run: |
          cmake -S . -B build -G Ninja -DUSE_SANITIZER=ON -DBM_GBA_BUILD_DIR=$PWD/build-gba
          cmake --build build
          ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: gba-images
          path: build-gba/*.gba

      - uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: build/test-output
